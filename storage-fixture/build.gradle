plugins { id 'com.android.application' }
android {
    namespace 'vn.fonesi.fixture.storage'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'vn.fonesi.fixture.storage'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-owned-fixture'
        buildConfigField 'String', 'SOURCE_SHA', '"' + (System.getenv('EXPECTED_SOURCE_SHA') ?: 'UNBOUND') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs = ['src/main/java', '../core/src/main/java', '../app/src/main/java/vn/fonesi/app/storage']
        main.assets.srcDir '../storage/sql'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        absolutePaths true
        textReport true
        textOutput file("$buildDir/reports/lint-results-debug.txt")
        xmlReport true
        htmlReport true
    }
}
// No external runtime or test dependencies. This is platform-only instrumentation.

// Test-only fixture: no severity exceptions; every reported lint issue is fatal.
android.lint.checkTestSources = true
