plugins { id 'com.android.application' }
android {
    namespace 'vn.fonesi.fixture.storage'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'vn.fonesi.fixture.storage'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-owned-fixture'
        buildConfigField 'String', 'SOURCE_SHA', '"' + (System.getenv('EXPECTED_SOURCE_SHA') ?: 'UNBOUND') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs = ['src/main/java', '../core/src/main/java', '../app/src/main/java/vn/fonesi/app/storage']
        main.assets.srcDir '../storage/sql'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        absolutePaths true
        textReport true
        textOutput file("$buildDir/reports/lint-results-debug.txt")
        xmlReport true
        htmlReport true
    }
}
// No external runtime or test dependencies. This is platform-only instrumentation.

// Test sources remain checked; the exact development notice policy below is separately gated.
android.lint.checkTestSources = true
// Finite development target36 notice for this exact owned-fixture verification task set.
// Not a release policy: actual reports must contain precisely the independently gated notice.
def fixtureTasks = [':storage-fixture:assembleDebug', ':storage-fixture-test:assembleDebug',
    ':storage-fixture:lintDebug', ':storage-fixture-test:lintDebug', ':storage-fixture-test:verifyFixtureDependencies']
def fixturePins = android.defaultConfig.minSdkVersion.apiLevel == 26 &&
    android.defaultConfig.targetSdkVersion.apiLevel == 36 && android.compileSdk == 36 &&
    com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION == '8.13.2' && gradle.gradleVersion == '8.14.6'
if (gradle.startParameter.taskNames == fixtureTasks && fixturePins) {
    android.lint.informational.add('OldTargetApi')
}
