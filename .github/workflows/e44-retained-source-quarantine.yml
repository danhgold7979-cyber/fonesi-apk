name: E44 Durable private source no-fallback guard

on:
  push:
    branches:
      - phase/e44-durable-retained-source-quarantine-20261029
    paths:
      - ".github/workflows/e44-retained-source-quarantine.yml"
      - "core/src/main/kotlin/vn/fonesi/core/update/UpdateTask.kt"
      - "core/src/main/kotlin/vn/fonesi/core/update/UpdateQueue.kt"
      - "core/src/main/kotlin/vn/fonesi/core/update/UpdateRunner.kt"
      - "core/src/test/kotlin/vn/fonesi/core/update/UpdateRunnerTest.kt"
      - "app/src/main/java/vn/fonesi/app/storage/TaskCodec.kt"
      - "app/src/main/java/vn/fonesi/app/storage/RoomUpdateTaskStore.kt"
      - "app/src/main/java/vn/fonesi/app/storage/UpdateTaskClusterOwnershipRepository.kt"
      - "app/src/main/java/vn/fonesi/app/storage/PrivateClusterRetainedEnqueuer.kt"
      - "app/src/main/java/vn/fonesi/app/storage/RoomLegacyUpdateSourcePolicy.kt"
      - "app/src/main/java/vn/fonesi/app/storage/LocalServices.kt"
      - "app/src/test/java/vn/fonesi/app/storage/StorageIntegrationTest.kt"
      - "app/src/test/java/vn/fonesi/app/storage/PrivateClusterRetainedEnqueuerTest.kt"
      - "app/src/test/java/vn/fonesi/app/storage/UpdateTaskClusterOwnershipRepositoryTest.kt"
      - "scripts/audit_e44_retained_source_quarantine.py"
      - "docs/phases/E44_DURABLE_RETAINED_SOURCE_GUARD_PLAN.md"
      - "docs/phases/E44_DURABLE_RETAINED_SOURCE_GUARD_RESULTS.md"
      - "docs/STATUS.md"
      - "docs/EXECUTION_PLAN.md"
      - "docs/PRODUCT_PROGRESS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonesi-e44-retained-source-quarantine-v1
  cancel-in-progress: true

jobs:
  retained-source-quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout exact E44 source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed audit of E40-E44 source and source authority
        run: |
          python3 -m py_compile scripts/audit_e40_clone_cluster_ownership.py scripts/audit_e41_update_task_cluster_ownership.py scripts/audit_e42_atomic_owner_transitions.py scripts/audit_e43_atomic_retained_enqueue.py scripts/audit_e44_retained_source_quarantine.py scripts/verify_main_build.py scripts/verify_candidate_build.py
          python3 scripts/audit_e40_clone_cluster_ownership.py
          python3 scripts/audit_e41_update_task_cluster_ownership.py
          python3 scripts/audit_e42_atomic_owner_transitions.py
          python3 scripts/audit_e43_atomic_retained_enqueue.py
          python3 scripts/audit_e44_retained_source_quarantine.py
      - name: Bootstrap pinned Android SDK36 and JDK21
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Cloud build tests lint and APK signature audit
        run: ./scripts/check.sh
      - name: Candidate tests lint and signed APK checks
        run: ./scripts/check.sh --with-engine-candidate
      - name: Verify unsupported split and destructive GC still disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path("app/src/candidate/java/vn/fonesi/app/runtime/RuntimeBindings.kt").read_text()
          backend = Path("app/src/candidate/java/vn/fonesi/app/runtime/SpaceCoreBackend.kt").read_text()
          runner = Path("core/src/main/kotlin/vn/fonesi/core/update/UpdateRunner.kt").read_text()
          assert "const val supportsSplits = false" in runtime
          assert "check(source.apkPaths.size == 1)" in backend
          assert "if (!mayUseLegacySource(next)) return@use RunResult.PolicyBlocked" in runner
          print("PASS: source gate prevents original-app fallback for retained private task.")
          PY
      - name: Upload generated v6 schema and sanitized results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E44-private-source-quarantine-TEST-ONLY
          path: |
            app/schemas/vn.fonesi.app.storage.FonesiDatabase/6.json
            app/build/reports/cloud-verification.json
            app/build/reports/candidate-verification.json
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            apk-runtime/build/test-results/test/TEST-*.xml
            core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
