name: E42 Atomic Room journal and private cluster owner transitions

on:
  push:
    branches:
      - phase/e42-atomic-journal-owner-transitions-20261029
    paths:
      - ".github/workflows/e42-atomic-journal-owner-transitions.yml"
      - "app/src/main/java/vn/fonesi/app/storage/RoomUpdateTaskStore.kt"
      - "app/src/main/java/vn/fonesi/app/storage/UpdateTaskClusterOwnershipRepository.kt"
      - "app/src/main/java/vn/fonesi/app/storage/FonesiDatabase.kt"
      - "app/src/test/java/vn/fonesi/app/storage/RoomRetainedJournalTransitionTest.kt"
      - "app/src/test/java/vn/fonesi/app/storage/UpdateTaskClusterOwnershipRepositoryTest.kt"
      - "scripts/audit_e42_atomic_owner_transitions.py"
      - "scripts/audit_e41_update_task_cluster_ownership.py"
      - "scripts/audit_e40_clone_cluster_ownership.py"
      - "docs/phases/E42_ATOMIC_JOURNAL_OWNER_TRANSITIONS_PLAN.md"
      - "docs/phases/E42_ATOMIC_JOURNAL_OWNER_TRANSITIONS_RESULTS.md"
      - "docs/STATUS.md"
      - "docs/PRODUCT_PROGRESS.md"
      - "docs/EXECUTION_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonesi-e42-atomic-room-owners-v1
  cancel-in-progress: true

jobs:
  atomic-journal-owner-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout exact E42 source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit E40-E42 ownership safety and compile Python verification
        run: |
          python3 -m py_compile scripts/audit_e40_clone_cluster_ownership.py scripts/audit_e41_update_task_cluster_ownership.py scripts/audit_e42_atomic_owner_transitions.py scripts/verify_main_build.py scripts/verify_candidate_build.py
          python3 scripts/audit_e40_clone_cluster_ownership.py
          python3 scripts/audit_e41_update_task_cluster_ownership.py
          python3 scripts/audit_e42_atomic_owner_transitions.py
      - name: Bootstrap pinned Android SDK36 Gradle and JDK21
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Test Room CAS retention and cloud build/lint/APK audit
        run: ./scripts/check.sh
      - name: Test opt-in candidate build and verify signed APK
        run: ./scripts/check.sh --with-engine-candidate
      - name: Check split import and destructive GC are still disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend = Path("app/src/candidate/java/vn/fonesi/app/runtime/SpaceCoreBackend.kt").read_text()
          runtime = Path("app/src/candidate/java/vn/fonesi/app/runtime/RuntimeBindings.kt").read_text()
          journal = Path("app/src/main/java/vn/fonesi/app/storage/RoomUpdateTaskStore.kt").read_text()
          assert "check(source.apkPaths.size == 1)" in backend
          assert "const val supportsSplits = false" in runtime
          for forbidden in ("engine.update(", "fun collectGarbage(", "fun deleteCluster(", "Files.delete("):
              assert forbidden not in journal
          print("PASS: E42 is transactional Room bookkeeping, not split-provider or destructive GC")
          PY
      - name: Upload E42 schema and sanitized cloud/candidate test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E42-atomic-retained-journal-TEST-ONLY
          path: |
            app/schemas/vn.fonesi.app.storage.FonesiDatabase/6.json
            app/build/reports/cloud-verification.json
            app/build/reports/candidate-verification.json
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            apk-runtime/build/test-results/test/TEST-*.xml
            core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
