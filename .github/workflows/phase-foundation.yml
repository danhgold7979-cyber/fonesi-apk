name: Clean APK foundation
on:
  push:
    branches: ['phase-*']
  pull_request:
    branches: [main, 'phase-*']
  workflow_dispatch:
env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
concurrency:
  group: clean-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentary-host:
    outputs:
      receipt: ${{ steps.host.outputs.receipt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Use runner JDK17
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Independent foundation checks and exact-source HOST receipt
        id: host
        run: python3 tools/run_host_checks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            host-receipt.json
            foundation-host.log
          if-no-files-found: error
          retention-days: 14
  android-compile:
    needs: documentary-host
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Use existing runner JDK17 and SDK only
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          python3 tools/check_toolchain.py --android
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Build, lint and packaged diagnostics with strict aggregate gate
        run: python3 tools/run_compile_checks.py
      - name: Bind successful HOST receipt from exact-source prerequisite job
        env:
          HOST_RECEIPT: ${{ needs.documentary-host.outputs.receipt }}
        run: python3 -c 'import os,json,pathlib; r=json.loads(os.environ["HOST_RECEIPT"]); assert r["source_sha"]==os.environ["EXPECTED_SOURCE_SHA"]; pathlib.Path("host-receipt.json").write_text(json.dumps(r,indent=2)+"\n")'
      - name: Record baseline only after all compile gates pass
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD > source-sha.txt
          python3 tools/record_baseline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-compile-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
            lint-receipt.json
            compile-receipt.json
            host-receipt.json
            baseline-receipt.json
            baseline-checklist.md
            docs/P0_BASELINE_REPRODUCTION.md
            source-sha.txt
          if-no-files-found: error
          retention-days: 14
