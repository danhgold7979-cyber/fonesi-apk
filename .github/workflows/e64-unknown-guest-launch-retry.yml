permissions:
  contents: read

concurrency:
  group: fonesi-e64-unknown-guest-launch-retry-v1
  cancel-in-progress: true

jobs:
  verified-source-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout exact E64 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact E64 source SHA (not synthetic PR merge commit)
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PASS: validated exact E64 source SHA $(git rev-parse HEAD)"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit E40-E64 uncertain guest launch and shared mutation safety
        run: |
          python3 -m py_compile scripts/audit_e40_clone_cluster_ownership.py scripts/audit_e41_update_task_cluster_ownership.py scripts/audit_e42_atomic_owner_transitions.py scripts/audit_e43_atomic_retained_enqueue.py scripts/audit_e44_atomic_batch_retained_enqueue.py scripts/audit_e44_retained_source_quarantine.py scripts/audit_e45_retained_batch_source_quarantine.py scripts/audit_e46_foreground_source_authority.py scripts/audit_e47_original_source_confirmation.py scripts/audit_e48_retained_recovery_quarantine.py scripts/audit_e49_source_authority_gates_integration.py scripts/audit_e50_preview_private_source_authority.py scripts/audit_e51_retained_enqueue_original_conflict.py scripts/audit_e52_engine_scoped_queue_recovery.py scripts/audit_e53_background_private_source_recovery.py scripts/audit_e54_unblocked_queue_selection.py scripts/audit_e55_engine_scoped_queue_controls.py scripts/audit_e56_stop_identity_revalidation.py scripts/audit_e57_clone_presentation_lock.py scripts/audit_e58_clone_cluster_association_lock.py scripts/audit_e59_delete_locktime_identity.py scripts/audit_e60_positive_guest_stop_readback.py scripts/audit_e61_guest_stop_identity_continuity.py scripts/audit_e62_ready_guest_launch_gate.py scripts/audit_e63_ready_shared_mutations.py scripts/audit_e64_unknown_guest_launch_retry.py scripts/verify_main_build.py scripts/verify_candidate_build.py
          python3 scripts/audit_e40_clone_cluster_ownership.py
          python3 scripts/audit_e41_update_task_cluster_ownership.py
          python3 scripts/audit_e42_atomic_owner_transitions.py
          python3 scripts/audit_e43_atomic_retained_enqueue.py
          python3 scripts/audit_e44_atomic_batch_retained_enqueue.py
          python3 scripts/audit_e44_retained_source_quarantine.py
          python3 scripts/audit_e45_retained_batch_source_quarantine.py
          python3 scripts/audit_e46_foreground_source_authority.py
          python3 scripts/audit_e47_original_source_confirmation.py
          python3 scripts/audit_e48_retained_recovery_quarantine.py
          python3 scripts/audit_e49_source_authority_gates_integration.py
          python3 scripts/audit_e50_preview_private_source_authority.py
          python3 scripts/audit_e51_retained_enqueue_original_conflict.py
          python3 scripts/audit_e52_engine_scoped_queue_recovery.py
          python3 scripts/audit_e53_background_private_source_recovery.py
          python3 scripts/audit_e54_unblocked_queue_selection.py
          python3 scripts/audit_e55_engine_scoped_queue_controls.py
          python3 scripts/audit_e56_stop_identity_revalidation.py
          python3 scripts/audit_e57_clone_presentation_lock.py
          python3 scripts/audit_e58_clone_cluster_association_lock.py
          python3 scripts/audit_e59_delete_locktime_identity.py
          python3 scripts/audit_e60_positive_guest_stop_readback.py
          python3 scripts/audit_e61_guest_stop_identity_continuity.py
          python3 scripts/audit_e62_ready_guest_launch_gate.py
          python3 scripts/audit_e63_ready_shared_mutations.py
          python3 scripts/audit_e64_unknown_guest_launch_retry.py
      - name: Bootstrap pinned Android SDK36 Gradle and JDK21
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Cloud tests lint signature and APK audit for E64
        run: ./scripts/check.sh
      - name: Candidate tests lint source SDK and signed APK audit for E64
        run: ./scripts/check.sh --with-engine-candidate
      - name: Verify E64 is not provider activation split import or garbage collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend = Path("app/src/candidate/java/vn/fonesi/app/runtime/SpaceCoreBackend.kt").read_text()
          runtime = Path("app/src/candidate/java/vn/fonesi/app/runtime/RuntimeBindings.kt").read_text()
          queue = Path("app/src/main/java/vn/fonesi/app/storage/PrivateClusterRetainedEnqueuer.kt").read_text()
          assert "check(source.apkPaths.size == 1)" in backend
          assert "const val supportsSplits = false" in runtime
          for forbidden in ("engine.update(", "engine.launch(", "fun collectGarbage(", "fun deleteCluster(", "Files.delete("):
              assert forbidden not in queue
          print("PASS: E64 does not activate provider, enable split or delete clusters")
          PY
      - name: Upload E64 generated schema and sanitized test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E64-unknown-guest-launch-retry-TEST-ONLY
          path: |
            app/schemas/vn.fonesi.app.storage.FonesiDatabase/6.json
            app/build/reports/cloud-verification.json
            app/build/reports/candidate-verification.json
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            apk-runtime/build/test-results/test/TEST-*.xml
            core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
