name: E36 private package-cluster store integrity

on:
  push:
    branches:
      - phase/e21-android-split-code-proof-20261028
    paths:
      - ".github/workflows/e36-private-cluster-store.yml"
      - "apk-runtime/src/main/kotlin/vn/fonesi/apk/PrivateApkStore.kt"
      - "apk-runtime/src/main/kotlin/vn/fonesi/apk/ApkSetAuditor.kt"
      - "apk-runtime/src/test/kotlin/vn/fonesi/apk/PrivateApkStoreTest.kt"
      - "apk-runtime/src/test/kotlin/vn/fonesi/apk/ApkSetAuditorTest.kt"
      - "core/src/main/kotlin/vn/fonesi/core/**"
      - "core/src/test/kotlin/vn/fonesi/core/**"
      - "app/src/candidate/java/vn/fonesi/app/runtime/**"
      - "app/build.gradle.kts"
      - "scripts/check.sh"
      - "scripts/verify_main_build.py"
      - "scripts/verify_candidate_build.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonesi-e36-private-cluster-store-v1
  cancel-in-progress: true

jobs:
  private-cluster-store-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout exact cumulative E36 source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source audits
        run: python3 -m py_compile scripts/verify_main_build.py scripts/verify_candidate_build.py
      - name: Bootstrap pinned Android SDK36 and JDK21
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Run APK cluster auditor, private store, core and app tests
        run: ./scripts/check.sh
      - name: Build and audit the opt-in candidate separately
        run: ./scripts/check.sh --with-engine-candidate
      - name: Assert the production provider still rejects split execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend = Path("app/src/candidate/java/vn/fonesi/app/runtime/SpaceCoreBackend.kt").read_text()
          bindings = Path("app/src/candidate/java/vn/fonesi/app/runtime/RuntimeBindings.kt").read_text()
          assert "check(source.apkPaths.size == 1)" in backend
          assert "const val supportsSplits = false" in bindings
          print("PASS: private cluster storage/audit does not enable SpaceCore split import.")
          print("NOT VERIFIED: provider installation/execution of a complete split cluster.")
          PY
      - name: Upload test-only store verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E36-private-cluster-store-TEST-ONLY
          path: |
            app/build/reports/cloud-verification.json
            app/build/reports/candidate-verification.json
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            apk-runtime/build/test-results/test/TEST-*.xml
            core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
