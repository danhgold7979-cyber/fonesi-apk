name: E14 synthetic guest Context scoped data proof

on:
  push:
    branches:
      - phase/e14-scoped-guest-context-20261028
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fonesi-e14-owned-avd-v1
  cancel-in-progress: true

jobs:
  android-emulator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout E14 source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate E14 bounded Android proof runner syntax
        run: python3 -m py_compile scripts/run_guest_code_emulator.py
      - name: Install pinned Android tools
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Build and lint E14 source and scoped synthetic guest APKs
        run: |
          python3 scripts/prepare_source_engine.py --install-tools
          ./scripts/gradle.sh :core:test :apk-runtime:test --console=plain
          ./scripts/gradle.sh -PincludeNativeRuntimeProbe=true -PsourceEngineAbi=x86_64 :engine-source:testDebugUnitTest --console=plain
          ./scripts/gradle.sh -PincludeNativeRuntimeProbe=true -PsourceEngineAbi=x86_64 :native-runtime-probe:assembleDebug :native-runtime-probe:lintDebug --console=plain
          ./scripts/gradle.sh -PincludeEngineProbe=true :probe-payload:assembleDebug :probe-payload:lintDebug --console=plain
      - name: Verify fresh APK cryptographic signatures
        run: |
          test -s native-runtime-probe/build/outputs/apk/debug/native-runtime-probe-debug.apk
          test -s probe-payload/build/outputs/apk/debug/probe-payload-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose native-runtime-probe/build/outputs/apk/debug/native-runtime-probe-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose probe-payload/build/outputs/apk/debug/probe-payload-debug.apk
          sha256sum native-runtime-probe/build/outputs/apk/debug/native-runtime-probe-debug.apk probe-payload/build/outputs/apk/debug/probe-payload-debug.apk

      - name: Audit exact synthetic native probe components, ELF and permissions
        run: python3 scripts/run_native_probe.py --audit-only
      - name: Install only Android 34 AOSP emulator image
        run: python3 scripts/prepare_native_emulator.py --install --image aosp34
      - name: Allow KVM for the ephemeral GitHub runner when present
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          else
            echo "KVM unavailable: proof will remain BLOCKED, not PASS"
          fi
      - name: Boot owned AVD and prove synthetic Context file, prefs and SQLite scopes
        run: |
          PROBE_SHA="$(sha256sum native-runtime-probe/build/outputs/apk/debug/native-runtime-probe-debug.apk | cut -d' ' -f1)"
          PAYLOAD_SHA="$(sha256sum probe-payload/build/outputs/apk/debug/probe-payload-debug.apk | cut -d' ' -f1)"
          python3 scripts/run_guest_code_emulator.py --apk-dir . --expected-probe-sha256 "$PROBE_SHA" --expected-payload-sha256 "$PAYLOAD_SHA" --source-commit "$GITHUB_SHA" --reports .local/e14-emulator --boot-timeout 480 --probe-timeout 180 --proof-level e14
      - name: Upload E14 signed synthetic APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E14-scoped-context-probe
          path: |
            native-runtime-probe/build/outputs/apk/debug/native-runtime-probe-debug.apk
            probe-payload/build/outputs/apk/debug/probe-payload-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload E14 sanitized Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E14-scoped-context-evidence
          path: .local/e14-emulator/
          if-no-files-found: warn
          retention-days: 7
