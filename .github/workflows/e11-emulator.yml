name: E11 real Android code-image proof (synthetic)

on:
  push:
    branches:
      - phase/e11-emulator-proof-20261028
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fonesi-e11-owned-avd
  cancel-in-progress: true

jobs:
  android-emulator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FONESI_TOOLS_DIR: /tmp/fonesi-tools
      ANDROID_HOME: /tmp/fonesi-tools/android-sdk
      ANDROID_SDK_ROOT: /tmp/fonesi-tools/android-sdk
    steps:
      - name: Checkout isolated E11 runner source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact signed synthetic APKs from green E10/E11 run
        uses: actions/download-artifact@v4
        with:
          name: fonesi-E11-synthetic-probe-debug
          run-id: 40638158372
          github-token: ${{ github.token }}
          path: .local/e11-input
      - name: Install pinned Android tools
        run: python3 scripts/bootstrap_android.py --accept-sdk-license
      - name: Install only Android 34 AOSP emulator image
        run: python3 scripts/prepare_native_emulator.py --install --image aosp34
      - name: Allow KVM for the ephemeral GitHub runner when present
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          else
            echo "KVM unavailable: proof will remain BLOCKED, not PASS"
          fi
      - name: Boot owned AVD and require actual Android DEX/resources receipt
        run: python3 scripts/run_guest_code_emulator.py --apk-dir .local/e11-input --reports .local/e11-emulator --boot-timeout 480 --probe-timeout 180
      - name: Upload sanitized runtime evidence even when Android fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonesi-E11-android-emulator-evidence
          path: .local/e11-emulator/
          if-no-files-found: warn
          retention-days: 7
