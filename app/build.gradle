plugins { id 'com.android.application' }

android {
    namespace 'vn.fonesi.app'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'vn.fonesi.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-foundation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDir '../core/src/main/java'
        main.assets.srcDir '../storage/sql'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        absolutePaths true
        textReport true
        textOutput file("$buildDir/reports/lint-results-debug.txt")
        xmlReport true
        htmlReport true
    }
}

// Finite foundation DEBUG baseline notice, never a release or broad lint exemption.
// The separate mandatory report gate retains and binds the actual notice to this SHA.
def foundationLintTasks = gradle.startParameter.taskNames == [':app:assembleDebug', ':app:lintDebug']
def foundationLintPins = android.defaultConfig.minSdkVersion.apiLevel == 26 &&
        android.defaultConfig.targetSdkVersion.apiLevel == 36 &&
        android.compileSdk == 36 &&
        com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION == '8.13.2' &&
        gradle.gradleVersion == '8.14.6'
if (foundationLintTasks && foundationLintPins) {
    android.lint.informational.add('OldTargetApi')
}
